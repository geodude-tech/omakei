<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omakei</title>
    <meta
      name="description"
      content="Import bank, credit card, and mortgage statements into one clean ledger with a crisp monthly spend overview."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--omakei:head-->
    <script type="module" crossorigin src="/assets/index-Cm2NPHaT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-NO_A_3N8.css">
  </head>
  <body>
    <style>
      @keyframes folio-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div
      id="folio-boot"
      style="
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-background, #111);
      "
    >
      <div
        aria-label="Loading ledger"
        style="
          width: 32px;
          height: 32px;
          border: 2px solid color-mix(in srgb, var(--color-foreground, #fff) 20%, transparent);
          border-top-color: var(--color-foreground, #fff);
          border-radius: 50%;
          animation: folio-spin 0.7s linear infinite;
        "
      ></div>
    </div>
    <script>(function(){
  var boot = document.getElementById("folio-boot");
  if (!boot) return;
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var month = q.get("m") || "";
  if (!/^\d{4}-\d{2}$/.test(month) || !q.has("sp") || !q.has("inc") || !q.has("n")) return;
  var spent = Number(q.get("sp"));
  var income = Number(q.get("inc"));
  var net = Number(q.get("n"));
  if (![spent, income, net].every(isFinite)) return;
  var uncat = Number(q.get("u") || "0");
  var reserved = Number(q.get("r") || "0");
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function money(n, sign){
    var v = Number(n) || 0;
    var formatted = Math.abs(v).toLocaleString("en-US", { style: "currency", currency: "USD" });
    if (v < -0.0001) return "\u2212" + formatted;
    if (sign && v > 0.0001) return "+" + formatted;
    return formatted;
  }
  function monthLabel(key){
    var parts = String(key).split("-");
    var y = Number(parts[0]);
    var m = Number(parts[1]);
    if (!y || !m || m < 1 || m > 12) return key;
    return MONTHS[m - 1] + " " + y;
  }
  function cell(label, value, color, hint, hintColor){
    return '<div style="background:var(--color-card,#fbf8f3);padding:16px 20px">'
      + '<p style="margin:0;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--color-muted-foreground,#6f6a62)">' + esc(label) + "</p>"
      + '<p style="margin:4px 0 0;font-family:var(--font-display,Fraunces,serif);font-size:clamp(1.5rem,2vw,1.875rem);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:' + color + '">' + esc(value) + "</p>"
      + (hint ? '<p style="margin:4px 0 0;font-size:12px;color:' + (hintColor || "var(--color-muted-foreground,#6f6a62)") + '">' + esc(hint) + "</p>" : "")
      + "</div>";
  }
  var muted = "var(--color-muted-foreground,#6f6a62)";
  var spend = "var(--color-spend,#8b4a3a)";
  var incomeC = "var(--color-income,#3d6b54)";
  var reservedC = "var(--color-reserved,#8c7a5c)";
  var netColor = net < -0.005 ? spend : net > 0.005 ? incomeC : "var(--color-foreground,#1c1914)";
  var html = "";
  html += '<header style="border-bottom:1px solid var(--color-border,#e0d8cb);background:var(--color-background,#f3efe7)">'
    + '<div style="margin:0 auto;max-width:72rem;display:flex;align-items:center;gap:12px;padding:12px 24px">'
    + '<p style="margin:0;flex:1;font-family:var(--font-display,Fraunces,serif);font-size:1.5rem;font-weight:500;font-style:italic">Omakei</p>'
    + '<p style="margin:0;font-family:var(--font-display,Fraunces,serif);font-size:1rem;font-weight:500">' + esc(monthLabel(month)) + "</p>"
    + "</div></header>";
  html += '<main style="margin:0 auto;max-width:72rem;padding:24px">'
    + '<section id="folio-boot-stats" style="display:grid;grid-template-columns:1fr 1fr;gap:1px;overflow:hidden;border-radius:12px;background:var(--color-border,#e0d8cb);box-shadow:var(--shadow-border,0 0 0 1px rgba(28,25,20,.06))">';
  html += cell("Spent", money(spent), spend);
  html += cell("Income", money(income), incomeC);
  html += cell("Net", money(net, true), netColor, reserved > 0 ? ("after " + money(reserved) + " reserved this month") : "", reservedC);
  html += cell("Uncategorized", String(Number.isFinite(uncat) ? Math.max(0, Math.round(uncat)) : 0), "var(--color-foreground,#1c1914)");
  var asides = q.getAll("sa");
  for (var i = 0; i < asides.length; i++) {
    var parts = String(asides[i] || "").split("\t");
    var name = parts[1] || "Set aside";
    var amount = Number(parts[2]);
    html += cell(name, money(Number.isFinite(amount) ? amount : 0), reservedC, "each month", reservedC);
  }
  html += "</section></main>";
  var css = document.createElement("style");
  css.textContent = "@media (min-width:768px){#folio-boot-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}";
  boot.innerHTML = "";
  boot.appendChild(css);
  var wrap = document.createElement("div");
  wrap.innerHTML = html;
  boot.appendChild(wrap);
  boot.style.display = "block";
  boot.style.overflow = "auto";
  boot.setAttribute("data-folio-preview", "1");
})();</script>
    <div id="root"></div>
  </body>
</html>
